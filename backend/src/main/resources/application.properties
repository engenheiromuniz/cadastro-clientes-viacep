spring.application.name=cadastro-clientes-viacep

# Porta: o Render define a variável PORT; localmente usa 8080
server.port=${PORT:8080}

# Origens liberadas no CORS (separadas por vírgula; aceita curingas)
# Em produção, defina APP_CORS_ALLOWED_ORIGINS no Render se mudar o domínio do frontend
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,https://cadastro-clientes-viacep.vercel.app,https://cadastro-clientes-viacep-*.vercel.app}
